<!DOCTYPE html>
<html>
<head>
  <title>QR Code Sound</title>
</head>
<body>
  <h1>🔊 Tap the button to play sound</h1>
  <button onclick="playSound()">Play Sound</button>

  <audio id="sound">
    <source src="Bagpipe.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    function playSound() {
      const sound = document.getElementById('sound');
      sound.play();
    }
  </script>
</body>
</html>
