<!DOCTYPE html>
<html>
<head>
  <title>QR Sound Trigger</title>
  <style>
    body {
      text-align: center;
      padding-top: 50px;
      font-family: sans-serif;
    }
    img {
      width: 200px;
      cursor: pointer;
    }
    h1 {
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <h1>🔊 Tap the image to play sound</h1>

  <img src="image.jpg" alt="Tap me" onclick="playSound()">

  <audio id="sound">
    <source src="Bagpipe.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    function playSound() {
      const sound = document.getElementById('sound');
      sound.play().catch(error => {
        console.log("Playback failed:", error);
      });
    }
  </script>
</body>
</html>
